name: build

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  windows-build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pre-beta repository checks
        shell: pwsh
        run: .\scripts\prebeta-check.ps1

      - name: Restore
        run: dotnet restore .\AppWatcher.sln

      - name: Build
        run: dotnet build .\AppWatcher.sln -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test .\tests\AppWatcher.Core.Tests\AppWatcher.Core.Tests.csproj -c Release --no-build --no-restore

      - name: Publish combined framework-dependent package
        shell: pwsh
        run: .\scripts\publish.ps1

      - name: Verify published package
        shell: pwsh
        run: .\scripts\verify-package.ps1 -PackagePath .\artifacts\AppWatcher-win-x64.zip

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: AppWatcher-win-x64
          path: artifacts/AppWatcher-win-x64.zip
          if-no-files-found: error
